<!DOCTYPE html>
<html>
<head>
    <title>Five Part Layout using DIV</title>
</head>

<body style="margin:0; font-family:Arial;">

    <!-- Header -->
    <div style="width:100vw; height:10vh; background-color:rgb(230, 182, 173);
                text-align:center; line-height:10vh;
                font-size:2rem; font-weight:bold;">
        MEDHASHRI
    </div>

    <!-- Main Content -->
    <div style="width:100%; height:80vh; margin:auto;">

        <!-- Left Section -->
        <div style="width:20%; height:100%; background-color:rgb(18, 82, 155);
                    float:left; text-align:center;
                    line-height:80vh; font-size:1.5em;">
            medhashrireddy@gmail.com
        </div>

        <!-- Center Section -->
        <div style="width:60%; height:100%; background-color:rgb(226, 177, 216);
                    float:left; text-align:center;
                    line-height:80vh; font-size:1.5em;">
         I Medhashri who is a third year student in CBIT ,I am clever person
        </div>

        <!-- Right Section -->
        <div style="width:20%; height:100%; background-color:rgb(130, 128, 240);
                    float:left; text-align:center;
                    line-height:80vh; font-size:1.5em;">
            Medhashri@24
        </div>

    </div>

    <!-- Footer -->
    <div style="clear:both; width:100vw; height:10vh;
                background-color:rgb(84, 224, 20);
                text-align:center; line-height:10vh;
                font-size:1.8rem; font-weight:bold;">
        Thank You
    </div>

</body>
</html>
