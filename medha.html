<!DOCTYPE html>
<html>
<head>
<style>
.container {
    display: grid;
    grid-template-columns: repeat(5, 150px);
    gap: 10px;
    background-color: rgb(21, 98, 170);
    padding: 10px;
}

.item {
    background-color: rgb(69, 148, 212);
    color: rgb(233, 108, 156);
    padding: 20px;
    text-align: center;
    font-size: 20px;
}
</style>
</head>
<body>

<div class="container">
    <div class="item">M</div>
    <div class="item">E</div>
    <div class="item">D</div>
    <div class="item">H</div>
    <div class="item">A</div>
    <div class="item">S</div>
    <div class="item">H</div>
    <div class="item">R</div>
    <div class="item">I</div>
</div>

</body>
</html>
